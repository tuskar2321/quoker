# Android release: signed APK, published on the core server (docs/08-android.md, docs/10-deploy.md).
#
# versionCode scheme (documented in docs/08-android.md): X.Y.Z -> X*10000 + Y*100 + Z, with Y and
# Z below 100. Derived from the tag, so the same tag always gives the same code, and codes grow
# with the version. Example: app-v0.2.0 -> 200, app-v1.0.0 -> 10000.
#
# Inputs: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD; variable ANDROID_API_BASE_URL (e.g. https://api.<domain>); the core SSH
# secrets. The changelog is the message of the annotated tag.
name: release-android

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, publish the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-release
    steps:
      - name: Check out (full history, the tag must be on master)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag, derive versionName and versionCode, read the changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG_OUT: ${{ runner.temp }}/changelog.txt
        run: .github/scripts/release-version.sh app "$TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform 37 and build-tools 37.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Decode the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode >"$RUNNER_TEMP/quoker-release.jks"
          test -s "$RUNNER_TEMP/quoker-release.jks"

      - name: Build the signed release APK
        working-directory: android
        env:
          # Signing secrets go through the environment, not the command line.
          QUOKER_SIGNING_STORE_FILE: ${{ runner.temp }}/quoker-release.jks
          QUOKER_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          QUOKER_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          QUOKER_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          : "${API_BASE_URL:?set the ANDROID_API_BASE_URL repository variable, e.g. https://api.<domain>}"
          ./gradlew --no-daemon :app:assembleRelease \
            -Pquoker.versionCode="$VERSION_CODE" \
            -Pquoker.versionName="$VERSION_NAME" \
            -Pquoker.apiBaseUrl="$API_BASE_URL"

      - name: Verify the APK (signature, package, version)
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/37.0.0"
          "$bt/apksigner" verify --print-certs "$apk"
          badging=$("$bt/aapt2" dump badging "$apk")
          printf '%s\n' "$badging" | head -n 1
          if ! printf '%s\n' "$badging" | grep -q "^package: name='app.quoker' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"; then
            echo "::error::the APK does not carry app.quoker $VERSION_NAME ($VERSION_CODE)" >&2
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/quoker-$VERSION_NAME.apk"

      - name: Upload to the core server and register the release
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CHANGELOG_FILE: ${{ steps.version.outputs.changelog_file }}
          DEPLOY_HOST: ${{ secrets.CORE_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CORE_SSH_KNOWN_HOSTS }}
        run: |
          .github/scripts/publish-apk.sh \
            "$RUNNER_TEMP/quoker-$VERSION_NAME.apk" "$VERSION_CODE" "$VERSION_NAME" "$CHANGELOG_FILE"
