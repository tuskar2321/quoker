# CI for every push to master and every pull request (docs/10-deploy.md, "CI/CD").
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: proto, go vet, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out (full history for buf breaking)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.50.0"

      - name: buf lint
        run: buf lint

      - name: buf breaking against master
        run: |
          # The base is master. A pull request has master in origin, not as a local branch.
          git update-ref refs/heads/master refs/remotes/origin/master
          buf breaking --against '.git#branch=master'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: go test -race
        run: go test -race ./...

      - name: shellcheck (deploy and dev scripts)
        run: shellcheck -x -P SCRIPTDIR .github/scripts/*.sh deploy/dev/seed.sh

  android:
    name: android lint, unit tests, debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install platform 37 and build-tools 37.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Gradle lint, unit tests, debug build
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
